<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эффективность полочного пространства · Золотое Яблоко Иркутск</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #09090b;
    --text-muted: #71717a;
    --text-subtle: #a1a1aa;
    --accent: #c5f04b;
    --accent-dark: #a8d83a;
    --accent-soft: #eefbd0;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 20px rgba(0,0,0,0.04);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-muted);
  }
  .brand-logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--accent);
    display: grid; place-items: center;
    font-weight: 700; color: #09090b;
    font-size: 14px;
  }
  .topbar-meta { font-size: 12px; color: var(--text-subtle); }

  .hero { padding: 40px 0 48px; }
  .hero-eyebrow {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    margin-bottom: 16px;
    max-width: 800px;
  }
  .hero h1 .accent {
    background: var(--accent);
    padding: 0 8px;
    border-radius: 8px;
  }
  .hero-sub {
    font-size: 17px;
    color: var(--text-muted);
    max-width: 680px;
    margin-bottom: 32px;
  }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .hero-meta span strong { color: var(--text); font-weight: 600; }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin: 32px 0 48px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .kpi-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .kpi-delta { font-size: 13px; margin-top: 8px; color: var(--text-muted); }
  .kpi-delta.pos { color: var(--success); }
  .kpi-delta.neg { color: var(--danger); }
  .kpi.target {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border-color: transparent;
  }
  .kpi.target .kpi-label,
  .kpi.target .kpi-delta { color: rgba(0,0,0,0.6); }
  .kpi.target .kpi-value { color: #09090b; }

  section { margin-bottom: 56px; }
  .section-head { margin-bottom: 20px; }
  .section-eyebrow {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent-dark);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .section-title {
    font-size: clamp(22px, 3.5vw, 28px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .section-desc {
    color: var(--text-muted);
    font-size: 15px;
    max-width: 720px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  canvas { display: block; max-width: 100%; }

  /* Tabs — компактные, в несколько строк */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab {
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
    min-height: 32px;
  }
  .tab:hover { border-color: var(--border-strong); color: var(--text); }
  .tab.active {
    background: var(--text);
    color: var(--surface);
    border-color: var(--text);
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .brand-list { display: grid; gap: 8px; }
  .brand-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    font-size: 14px;
  }
  .brand-row .name { font-weight: 500; }
  .brand-row .eff {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  .brand-row .eff.hi { background: var(--accent-soft); color: #3f5f00; }
  .brand-row .eff.mid { background: #fef3c7; color: #92400e; }
  .brand-row .eff.lo { background: #fee2e2; color: #991b1b; }
  .brand-row .shelves {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 760px) {
    .two-col { grid-template-columns: 1fr 1fr; }
  }

  .col-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .col-head .dot.green { background: var(--success); }
  .col-head .dot.red { background: var(--danger); }

  /* Пожиратели — расширенный блок */
  .predators-card {
    background: linear-gradient(135deg, #fef2f2 0%, #fff 60%);
    border: 1px solid #fecaca;
    border-radius: var(--radius-lg);
    padding: 28px;
  }
  .predators-card h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .predators-card > p {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.55;
  }
  .predators-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .predators-stat {
    background: rgba(255,255,255,0.7);
    border: 1px solid #fecaca;
    border-radius: var(--radius-sm);
    padding: 14px;
  }
  .predators-stat .b { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .predators-stat .v {
    font-size: 22px;
    font-weight: 700;
    color: var(--danger);
    font-variant-numeric: tabular-nums;
  }
  .predators-stat .d { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .predators-table-wrap {
    overflow-x: auto;
    border-radius: var(--radius-sm);
    border: 1px solid #fecaca;
    background: rgba(255,255,255,0.7);
  }
  .predators-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 560px;
  }
  .predators-table th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #991b1b;
    background: rgba(254, 202, 202, 0.3);
    border-bottom: 1px solid #fecaca;
  }
  .predators-table td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(254, 202, 202, 0.4);
    font-variant-numeric: tabular-nums;
  }
  .predators-table tr:last-child td { border-bottom: none; }
  .predators-table .loss {
    color: var(--danger);
    font-weight: 600;
  }

  /* Новые бренды */
  .new-brands-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .new-brands-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .new-brands-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .new-brand {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: all 0.2s;
  }
  .new-brand:hover {
    border-color: var(--accent-dark);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .new-brand-cat {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent-dark);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .new-brand-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .new-brand-country {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .new-brand-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .new-brand-metrics {
    display: flex;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .new-brand-metrics .m-label { color: var(--text-muted); }
  .new-brand-metrics .m-val { font-weight: 600; color: var(--text); }

  /* Small multiples */
  .sm-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 640px) {
    .sm-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 960px) {
    .sm-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .sm-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow-sm);
  }
  .sm-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    gap: 8px;
  }
  .sm-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .sm-kpi {
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .sm-kpi.hi { background: var(--accent-soft); color: #3f5f00; }
  .sm-kpi.mid { background: #fef3c7; color: #92400e; }
  .sm-kpi.lo { background: #fee2e2; color: #991b1b; }
  .sm-canvas-wrap {
    position: relative;
    width: 100%;
  }
  .sm-canvas-wrap canvas {
    width: 100%;
    height: auto;
    display: block;
  }
  .sm-legend {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .sm-legend span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sm-legend i {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
  }

  /* Roadmap */
  .roadmap { display: grid; gap: 12px; }
  .roadmap-step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px;
    align-items: start;
  }
  .step-num {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--accent);
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 15px;
    color: #09090b;
    flex-shrink: 0;
  }
  .step-body h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .step-body p { font-size: 13px; color: var(--text-muted); line-height: 1.55; }
  .step-body ul { margin-top: 8px; padding-left: 18px; font-size: 13px; color: var(--text-muted); }
  .step-body li { margin-bottom: 4px; }

  /* Итог */
  .summary-card {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    border-radius: var(--radius-lg);
    padding: 32px;
  }
  .summary-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(0,0,0,0.5);
    margin-bottom: 16px;
  }
  .summary-list {
    list-style: none;
    display: grid;
    gap: 12px;
  }
  .summary-list li {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: start;
    font-size: 14px;
    color: #09090b;
    line-height: 1.5;
  }
  .summary-list .bullet {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #09090b;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .summary-list strong { font-weight: 700; }
  .summary-kpi {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.15);
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .summary-kpi-item .l {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgba(0,0,0,0.5);
    margin-bottom: 4px;
  }
  .summary-kpi-item .v {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  footer {
    padding: 32px 0;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: var(--text-subtle);
  }

  @media (max-width: 600px) {
    main { padding: 16px 16px 60px; }
    .card { padding: 18px; }
    .predators-card { padding: 20px; }
    .summary-card { padding: 24px; }
    .kpi-value { font-size: 26px; }
  }
</script>
</head>

   ========================================================= */
function kpiClass(v) {
  if (v >= 1.0) return "hi";
  if (v >= 0.7) return "mid";
  return "lo";
}

function roundRect(ctx, x, y, w, h, r) {
  if (w < 0) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawDeptChart(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const data = [...DEPARTMENTS].sort((a,b) => b.aug - a.aug);
  const maxVal = Math.max(...data.map(d => d.aug), 2.2);

  const rowH = 30;
  const padL = 200, padR = 50, padT = 20, padB = 30;
  const W = Math.max(640, canvas.parentElement.clientWidth);
  const H = padT + padB + data.length * rowH;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const chartW = W - padL - padR;

  ctx.strokeStyle = "#e4e4e7";
  ctx.lineWidth = 1;
  ctx.font = "11px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#a1a1aa";
  ctx.textAlign = "center";
  for (let v = 0; v <= maxVal; v += 0.5) {
    const x = padL + (v / maxVal) * chartW;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, H - padB);
    ctx.stroke();
    if (v % 1 === 0) ctx.fillText(v.toFixed(1), x, H - padB + 14);
  }

  const targetX = padL + (1.0 / maxVal) * chartW;
  ctx.strokeStyle = "#09090b";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(targetX, padT);
  ctx.lineTo(targetX, H - padB);
  ctx.stroke();
  ctx.setLineDash([]);

  data.forEach((d, i) => {
    const val = d.aug;
    const y = padT + i * rowH;
    const bw = (val / maxVal) * chartW;

    ctx.fillStyle = "#09090b";
    ctx.textAlign = "right";
    ctx.font = "12px -apple-system, system-ui, sans-serif";
    ctx.fillText(d.name, padL - 10, y + rowH / 2 + 4);

    let color = "#f87171";
    if (val >= 1.0) color = "#c5f04b";
    else if (val >= 0.7) color = "#fbbf24";

    ctx.fillStyle = color;
    const barH = rowH - 10;
    roundRect(ctx, padL, y + 5, Math.max(2, bw), barH, 4);
    ctx.fill();

    ctx.fillStyle = "#09090b";
    ctx.textAlign = "left";
    ctx.font = "600 11px -apple-system, system-ui, sans-serif";
    ctx.fillText(val.toFixed(2), padL + bw + 6, y + rowH / 2 + 4);
  });
}

function drawDynChart(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const data = [...DEPARTMENTS].sort((a,b) => b.aug - a.aug);
  const maxVal = Math.max(...data.flatMap(d => [d.jul, d.aug]), 2.2);

  const padL = 50, padR = 20, padT = 20, padB = 120;
  const barGroupW = 44;
  const W = Math.max(640, padL + padR + data.length * barGroupW);
  const H = 420;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  // Grid
  ctx.strokeStyle = "#e4e4e7";
  ctx.lineWidth = 1;
  ctx.font = "11px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#a1a1aa";
  ctx.textAlign = "right";
  for (let v = 0; v <= maxVal; v += 0.5) {
    const y = padT + chartH - (v / maxVal) * chartH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(1), padL - 8, y + 4);
  }

  // Target line
  const targetY = padT + chartH - (1.0 / maxVal) * chartH;
  ctx.strokeStyle = "#09090b";
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(padL, targetY);
  ctx.lineTo(padL + chartW, targetY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Bars
  const groupW = chartW / data.length;
  const barW = groupW * 0.35;
  const gap = 2;

  data.forEach((d, i) => {
    const gx = padL + i * groupW + groupW / 2;

    // July bar
    const jh = (d.jul / maxVal) * chartH;
    ctx.fillStyle = "#a8d83a";
    roundRect(ctx, gx - barW - gap/2, padT + chartH - jh, barW, jh, 3);
    ctx.fill();

    // August bar
    const ah = (d.aug / maxVal) * chartH;
    ctx.fillStyle = "#09090b";
    roundRect(ctx, gx + gap/2, padT + chartH - ah, barW, ah, 3);
    ctx.fill();

    // X label (rotated)
    ctx.save();
    ctx.translate(gx, padT + chartH + 10);
    ctx.rotate(-Math.PI / 3);
    ctx.fillStyle = "#71717a";
    ctx.font = "11px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(d.name, 0, 0);
    ctx.restore();
  });
}

function drawSmallCanvas(canvas, rows) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth || 280;
  const H = 180;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const padL = 28, padR = 10, padT = 10, padB = 22;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  if (!rows.length) {
    ctx.fillStyle = "#a1a1aa";
    ctx.font = "11px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Нет данных", W / 2, H / 2);
    return;
  }

  const maxSh = Math.max(...rows.map(r => r.shelves), 5);
  const maxEff = Math.max(...rows.map(r => r.eff), 2);

  // Grid
  ctx.strokeStyle = "#f4f4f5";
  ctx.lineWidth = 1;
  ctx.font = "9px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#a1a1aa";

  // Y axis (eff)
  ctx.textAlign = "right";
  for (let v = 0; v <= maxEff; v += Math.max(1, Math.ceil(maxEff / 4))) {
    const y = padT + chartH - (v / maxEff) * chartH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(0), padL - 4, y + 3);
  }

  // X axis (shelves)
  ctx.textAlign = "center";
  for (let v = 0; v <= maxSh; v += Math.max(1, Math.ceil(maxSh / 4))) {
    const x = padL + (v / maxSh) * chartW;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT + chartH);
    ctx.stroke();
    ctx.fillText(v, x, H - padB + 12);
  }

  // Target line eff=1.0
  if (maxEff >= 1.0) {
    const targetY = padT + chartH - (1.0 / maxEff) * chartH;
    ctx.strokeStyle = "#09090b";
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, targetY);
    ctx.lineTo(padL + chartW, targetY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Bubbles
  // Сортируем: сначала крупные (больше полок + ниже KPI), чтобы мелкие были поверх
  const sorted = [...rows].sort((a, b) => {
    const scoreA = a.shelves * (2 - Math.min(a.eff, 2));
    const scoreB = b.shelves * (2 - Math.min(b.eff, 2));
    return scoreB - scoreA;
  });

  sorted.forEach(r => {
    const x = padL + (r.shelves / maxSh) * chartW;
    const y = padT + chartH - (Math.min(r.eff, maxEff) / maxEff) * chartH;
    // Размер: зависит от "важности" (полки × недополученная эффективность)
    const importance = r.shelves * Math.max(0, 1 - Math.min(r.eff, 1));
    const baseR = 3;
    const radius = baseR + Math.min(8, Math.sqrt(importance) * 1.2);

    let color = "#f87171";
    if (r.eff >= 2.0) color = "#c5f04b";
    else if (r.eff >= 0.8) color = "#fbbf24";

    ctx.fillStyle = color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Подпись для крупных точек
    if (r.shelves >= 8 || r.eff >= 4 || r.shelves >= 15) {
      ctx.fillStyle = "#09090b";
      ctx.font = "600 9px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "left";
      const shortName = r.brand.length > 12 ? r.brand.slice(0, 11) + "…" : r.brand;
      ctx.fillText(shortName, x + radius + 2, y + 3);
    }
  });
}

      title: "Контроль стока и обучение",
      desc: "Защитить достигнутые показатели от OOS и повысить экспертизу команды.",
      items: [
        "Ежедневный мониторинг задников для ВЭД-брендов (Celimax, d'Alba, Payot)",
        "Утренние брифинги с фокусом на бренды KPI 0.7–0.9",
        "Правило: бренд < 0.3 на 5+ полках 2 месяца → делистинг",
        "Ежемесячный пересчет планограмм на основе данных"
      ]
    }
  ];

  const roadmap = document.createElement("div");
  roadmap.className = "roadmap";
  steps.forEach((s, i) => {
    const step = document.createElement("div");
    step.className = "roadmap-step";
    step.innerHTML = `
      <div class="step-num">${i + 1}</div>
      <div class="step-body">
        <h4>${s.title}</h4>
        <p>${s.desc}</p>
        <ul>${s.items.map(it => `<li>${it}</li>`).join("")}</ul>
      </div>
    `;
    roadmap.appendChild(step);
  });
  wrap.appendChild(roadmap);
  return wrap;
}

/* ----- Итог (сухой) ----- */
function renderSummary() {
  const wrap = document.createElement("section");
  const card = document.createElement("div");
  card.className = "summary-card";

  const totalSh = PREDATORS.reduce((a, p) => a + p.shelves, 0);
  const totalLoss = PREDATORS.reduce((a, p) => a + p.loss, 0);
  const aboveTarget = DEPARTMENTS.filter(d => d.aug >= 1.0).length;

  card.innerHTML = `
    <div class="summary-label">Итоги отчёта</div>
    <ul class="summary-list">
      <li><span class="bullet"></span><span>Средний KPI сети по отделам за август 2026 составил <strong>0.90</strong> при целевом показателе <strong>1.00</strong>. Разрыв — 0.10 пункта.</span></li>
      <li><span class="bullet"></span><span>Из 17 отделов целевой порог 1.0 преодолевают <strong>${aboveTarget}</strong> отделов. Ещё 6 отделов находятся в критической зоне с KPI ниже 0.5.</span></li>
      <li><span class="bullet"></span><span>Выявлено <strong>${PREDATORS.length} брендов-«пожирателей»</strong>, которые занимают <strong>${totalSh} полок</strong> при среднем KPI ниже 0.5. Совокупные потери эффективности — <strong>${totalLoss.toFixed(1)}</strong> условных единиц.</span></li>
      <li><span class="bullet"></span><span>Одновременно зафиксированы бренды-лидеры с KPI от 2.0 до 14.25, испытывающие дефицит полочного пространства и теряющие продажи из-за OOS.</span></li>
      <li><span class="bullet"></span><span>Для достижения цели 1.0 предлагается перераспределить ~60 полок от аутсайдеров к лидерам и авторизовать <strong>10 новых брендов</strong>, официально представленных в сети Золотое Яблоко.</span></li>
      <li><span class="bullet"></span><span>Реализация плана не требует дополнительных инвестиций в аренду или ремонт и может быть выполнена в течение одного квартала.</span></li>
    </ul>
    <div class="summary-kpi">
      <div class="summary-kpi-item">
        <div class="l">Текущий KPI</div>
        <div class="v">0.90</div>
      </div>
      <div class="summary-kpi-item">
        <div class="l">Целевой KPI</div>
        <div class="v">1.00</div>
      </div>
      <div class="summary-kpi-item">
        <div class="l">Разрыв</div>
        <div class="v">+0.10</div>
      </div>
      <div class="summary-kpi-item">
        <div class="l">Полок к перераспределению</div>
        <div class="v">~60</div>
      </div>
      <div class="summary-kpi-item">
        <div class="l">Новых брендов к авторизации</div>
        <div class="v">10</div>
      </div>
    </div>
  `;
  wrap.appendChild(card);
  return wrap;
}

function renderFooter() {
  const f = document.createElement("footer");
  f.innerHTML = `
    <div>Аналитический отчёт · Золотое Яблоко Иркутск · 2026</div>
    <div style="margin-top:4px">Подготовлено: Масликова Дарья Владимировна, главный мерчандайзер</div>
  `;
  return f;
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  render();
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const c1 = document.getElementById("deptChart");
      const c2 = document.getElementById("dynChart");
      if (c1) drawDeptChart(c1);
      if (c2) drawDynChart(c2);
      // Перерисовка small multiples
      const byDept = {};
      SHEET_DATA.forEach(r => {
        if (!byDept[r.dept]) byDept[r.dept] = [];
        byDept[r.dept].push(r);
      });
      document.querySelectorAll(".sm-grid canvas").forEach(c => {
        drawSmallCanvas(c, byDept[c.dataset.dept] || []);
      });
    }, 200);
  });
}

init();
</script>
</body>
</html>
