<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эффективность полочного пространства · Золотое Яблоко Иркутск</title>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #09090b;
  --text-muted: #71717a;
  --text-subtle: #a1a1aa;
  --accent: #c5f04b;
  --accent-dark: #a8d83a;
  --accent-soft: #eefbd0;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 20px rgba(0,0,0,0.04);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-muted);
}
.brand-logo {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--accent);
  display: grid; place-items: center;
  font-weight: 700; color: #09090b;
  font-size: 14px;
}
.topbar-meta { font-size: 12px; color: var(--text-subtle); }

.hero { padding: 40px 0 48px; }
.hero-eyebrow {
  display: inline-block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 16px;
}
.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 16px;
  max-width: 800px;
}
.hero h1 .accent {
  background: var(--accent);
  padding: 0 8px;
  border-radius: 8px;
}
.hero-sub {
  font-size: 17px;
  color: var(--text-muted);
  max-width: 680px;
  margin-bottom: 32px;
}
.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  font-size: 13px;
  color: var(--text-muted);
}
.hero-meta span strong { color: var(--text); font-weight: 600; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin: 32px 0 48px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}
.kpi-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.kpi-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1;
}
.kpi-delta { font-size: 13px; margin-top: 8px; color: var(--text-muted); }
.kpi-delta.pos { color: var(--success); }
.kpi-delta.neg { color: var(--danger); }
.kpi.target {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-color: transparent;
}
.kpi.target .kpi-label,
.kpi.target .kpi-delta { color: rgba(0,0,0,0.6); }
.kpi.target .kpi-value { color: #09090b; }

section { margin-bottom: 56px; }
.section-head { margin-bottom: 20px; }
.section-eyebrow {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent-dark);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}
.section-title {
  font-size: clamp(22px, 3.5vw, 28px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.section-desc {
  color: var(--text-muted);
  font-size: 15px;
  max-width: 720px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}

.chart-wrap {
  position: relative;
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
canvas { display: block; max-width: 100%; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.tab {
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  white-space: nowrap;
  min-height: 32px;
}
.tab:hover { border-color: var(--border-strong); color: var(--text); }
.tab.active {
  background: var(--text);
  color: var(--surface);
  border-color: var(--text);
}
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.brand-list { display: grid; gap: 8px; }
.brand-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  font-size: 14px;
}
.brand-row .name { font-weight: 500; }
.brand-row .eff {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
}
.brand-row .eff.hi { background: var(--accent-soft); color: #3f5f00; }
.brand-row .eff.mid { background: #fef3c7; color: #92400e; }
.brand-row .eff.lo { background: #fee2e2; color: #991b1b; }
.brand-row .shelves {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.two-col {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
@media (min-width: 760px) {
  .two-col { grid-template-columns: 1fr 1fr; }
}

.col-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.col-head .dot { width: 8px; height: 8px; border-radius: 50%; }
.col-head .dot.green { background: var(--success); }
.col-head .dot.red { background: var(--danger); }

.predators-card {
  background: linear-gradient(135deg, #fef2f2 0%, #fff 60%);
  border: 1px solid #fecaca;
  border-radius: var(--radius-lg);
  padding: 28px;
}
.predators-card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}
.predators-card > p {
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 16px;
  line-height: 1.55;
}
.formula-box {
  background: rgba(255,255,255,0.85);
  border: 1px dashed #fca5a5;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
}
.formula-box .formula {
  display: block;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  background: #fff;
  border: 1px solid #fecaca;
  border-radius: 6px;
  padding: 8px 12px;
  margin: 8px 0;
  color: #991b1b;
  font-weight: 500;
}
.formula-box .note {
  display: block;
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 6px;
}

.predators-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.predators-stat {
  background: rgba(255,255,255,0.7);
  border: 1px solid #fecaca;
  border-radius: var(--radius-sm);
  padding: 14px;
}
.predators-stat .b { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.predators-stat .v {
  font-size: 22px;
  font-weight: 700;
  color: var(--danger);
  font-variant-numeric: tabular-nums;
}
.predators-stat .d { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.predators-table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-sm);
  border: 1px solid #fecaca;
  background: rgba(255,255,255,0.7);
}
.predators-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 560px;
}
.predators-table th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #991b1b;
  background: rgba(254, 202, 202, 0.3);
  border-bottom: 1px solid #fecaca;
}
.predators-table td {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(254, 202, 202, 0.4);
  font-variant-numeric: tabular-nums;
}
.predators-table tr:last-child td { border-bottom: none; }
.predators-table .loss {
  color: var(--danger);
  font-weight: 600;
}

.new-brands-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 640px) {
  .new-brands-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 960px) {
  .new-brands-grid { grid-template-columns: repeat(3, 1fr); }
}
.new-brand {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: all 0.2s;
}
.new-brand:hover {
  border-color: var(--accent-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.new-brand-cat {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent-dark);
  background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 10px;
}
.new-brand-name {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.new-brand-country {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.new-brand-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 14px;
  line-height: 1.5;
}
.new-brand-metrics {
  display: flex;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
}
.new-brand-metrics .m-label { color: var(--text-muted); }
.new-brand-metrics .m-val { font-weight: 600; color: var(--text); }

.roadmap { display: grid; gap: 12px; }
.roadmap-step {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: start;
}
.step-num {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--accent);
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 15px;
  color: #09090b;
  flex-shrink: 0;
}
.step-body h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.step-body p { font-size: 13px; color: var(--text-muted); line-height: 1.55; }
.step-body ul { margin-top: 8px; padding-left: 18px; font-size: 13px; color: var(--text-muted); }
.step-body li { margin-bottom: 4px; }

.summary-card {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
  border-radius: var(--radius-lg);
  padding: 32px;
}
.summary-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(0,0,0,0.5);
  margin-bottom: 16px;
}
.summary-list {
  list-style: none;
  display: grid;
  gap: 12px;
}
.summary-list li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: start;
  font-size: 14px;
  color: #09090b;
  line-height: 1.5;
}
.summary-list .bullet {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #09090b;
  margin-top: 8px;
  flex-shrink: 0;
}
.summary-list strong { font-weight: 700; }
.summary-kpi {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid rgba(0,0,0,0.15);
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.summary-kpi-item .l {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: rgba(0,0,0,0.5);
  margin-bottom: 4px;
}
.summary-kpi-item .v {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-muted);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

footer {
  padding: 32px 0;
  border-top: 1px solid var(--border);
  margin-top: 40px;
  text-align: center;
  font-size: 12px;
  color: var(--text-subtle);
}

@media (max-width: 600px) {
  main { padding: 16px 16px 60px; }
  .card { padding: 18px; }
  .predators-card { padding: 20px; }
  .summary-card { padding: 24px; }
  .kpi-value { font-size: 26px; }
}
</style>

function kpiClass(v) {
  if (v >= 1.0) return "hi";
  if (v >= 0.7) return "mid";
  return "lo";
}

function roundRect(ctx, x, y, w, h, r) {
  if (w < 0) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawDeptChart(canvas) {
  var dpr = window.devicePixelRatio || 1;
  var data = DEPARTMENTS.slice().sort(function(a,b){ return b.aug - a.aug; });
  var maxVal = Math.max.apply(null, data.map(function(d){ return d.aug; }));
  if (maxVal < 2.2) maxVal = 2.2;

  var rowH = 30;
  var padL = 200, padR = 50, padT = 20, padB = 30;
  var W = Math.max(640, canvas.parentElement.clientWidth);
  var H = padT + padB + data.length * rowH;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  var chartW = W - padL - padR;

  ctx.strokeStyle = "#e4e4e7";
  ctx.lineWidth = 1;
  ctx.font = "11px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#a1a1aa";
  ctx.textAlign = "center";
  var v;
  for (v = 0; v <= maxVal; v += 0.5) {
    var x = padL + (v / maxVal) * chartW;
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, H - padB);
    ctx.stroke();
    if (v % 1 === 0) ctx.fillText(v.toFixed(1), x, H - padB + 14);
  }

  var targetX = padL + (1.0 / maxVal) * chartW;
  ctx.strokeStyle = "#09090b";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(targetX, padT);
  ctx.lineTo(targetX, H - padB);
  ctx.stroke();
  ctx.setLineDash([]);

  data.forEach(function(d, i) {
    var val = d.aug;
    var y = padT + i * rowH;
    var bw = (val / maxVal) * chartW;

    ctx.fillStyle = "#09090b";
    ctx.textAlign = "right";
    ctx.font = "12px -apple-system, system-ui, sans-serif";
    ctx.fillText(d.name, padL - 10, y + rowH / 2 + 4);

    var color = "#f87171";
    if (val >= 1.0) color = "#c5f04b";
    else if (val >= 0.7) color = "#fbbf24";

    ctx.fillStyle = color;
    var barH = rowH - 10;
    roundRect(ctx, padL, y + 5, Math.max(2, bw), barH, 4);
    ctx.fill();

    ctx.fillStyle = "#09090b";
    ctx.textAlign = "left";
    ctx.font = "600 11px -apple-system, system-ui, sans-serif";
    ctx.fillText(val.toFixed(2), padL + bw + 6, y + rowH / 2 + 4);
  });
}

function drawDynChart(canvas) {
  var dpr = window.devicePixelRatio || 1;
  var data = DEPARTMENTS.slice().sort(function(a,b){ return b.aug - a.aug; });
  var maxVal = 2.2;
  var i, v;
  for (i = 0; i < data.length; i++) {
    if (data[i].jul > maxVal) maxVal = data[i].jul;
    if (data[i].aug > maxVal) maxVal = data[i].aug;
  }

  var padL = 50, padR = 20, padT = 20, padB = 120;
  var barGroupW = 44;
  var W = Math.max(640, padL + padR + data.length * barGroupW);
  var H = 420;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  var ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  var chartW = W - padL - padR;
  var chartH = H - padT - padB;

  ctx.strokeStyle = "#e4e4e7";
  ctx.lineWidth = 1;
  ctx.font = "11px -apple-system, system-ui, sans-serif";
  ctx.fillStyle = "#a1a1aa";
  ctx.textAlign = "right";
  for (v = 0; v <= maxVal; v += 0.5) {
    var y = padT + chartH - (v / maxVal) * chartH;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(1), padL - 8, y + 4);
  }

  var targetY = padT + chartH - (1.0 / maxVal) * chartH;
  ctx.strokeStyle = "#09090b";
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(padL, targetY);
  ctx.lineTo(padL + chartW, targetY);
  ctx.stroke();
  ctx.setLineDash([]);

  var groupW = chartW / data.length;
  var barW = groupW * 0.35;
  var gap = 2;

  data.forEach(function(d, i) {
    var gx = padL + i * groupW + groupW / 2;

    var jh = (d.jul / maxVal) * chartH;
    ctx.fillStyle = "#a8d83a";
    roundRect(ctx, gx - barW - gap/2, padT + chartH - jh, barW, jh, 3);
    ctx.fill();

    var ah = (d.aug / maxVal) * chartH;
    ctx.fillStyle = "#09090b";
    roundRect(ctx, gx + gap/2, padT + chartH - ah, barW, ah, 3);
    ctx.fill();

    ctx.save();
    ctx.translate(gx, padT + chartH + 10);
    ctx.rotate(-Math.PI / 3);
    ctx.fillStyle = "#71717a";
    ctx.font = "11px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(d.name, 0, 0);
    ctx.restore();
  });
}

function renderPredators() {
  var wrap = document.createElement("section");
  wrap.innerHTML = '<div class="section-head"><div class="section-eyebrow">Ключевая проблема</div><h2 class="section-title">«Пожиратели» полочного пространства</h2><p class="section-desc">Бренды с низкой эффективностью, занимающие значительное количество полок. Ранжированы по величине недополученной эффективности — чем больше значение, тем сильнее бренд тянет показатель отдела вниз.</p></div>';

  var card = document.createElement("div");
  card.className = "predators-card";

  var totalShelves = 0;
  var totalLoss = 0;
  var totalEffWeighted = 0;
  PREDATORS.forEach(function(p) {
    totalShelves += p.shelves;
    totalLoss += p.loss;
    totalEffWeighted += p.eff * p.shelves;
  });
  var avgEff = totalShelves > 0 ? totalEffWeighted / totalShelves : 0;

  card.innerHTML = '<h3>' + PREDATORS.length + ' брендов занимают ' + totalShelves + ' полок при среднем KPI ' + avgEff.toFixed(2) + '</h3><p>Совокупные потери эффективности от этих брендов — <strong>' + totalLoss.toFixed(1) + ' единиц недополученной эффективности</strong>. Это показывает, сколько пунктов KPI недополучают отделы из-за того, что полки заняты неэффективными брендами вместо брендов с целевым KPI = 1.0.</p>';

  // Формула
  var formulaBox = document.createElement("div");
  formulaBox.className = "formula-box";
  formulaBox.innerHTML = '<strong>Как считается «потеря эффективности» бренда:</strong><span class="formula">Потеря = (1.0 − KPI бренда) × Количество полок</span>Каждая полка, занятая брендом с KPI ниже 1.0, «недодаёт» отделу разницу между фактическим KPI бренда и целевым показателем 1.0. Сумма по всем полкам бренда даёт совокупную потерю эффективности, которую можно было бы получить, если бы эти полки занял бренд с KPI = 1.0.<span class="note">Пример: GO TAPA занимает 20 полок при KPI 0.34 → потеря = (1.0 − 0.34) × 20 = <strong>13.2 единиц</strong> недополученной эффективности.</span>';
  card.appendChild(formulaBox);

  // Stats
  var statsDiv = document.createElement("div");
  statsDiv.className = "predators-stats";
  statsDiv.innerHTML = '<div class="predators-stat"><div class="b">Всего брендов</div><div class="v">' + PREDATORS.length + '</div><div class="d">в списке «пожирателей»</div></div><div class="predators-stat"><div class="b">Всего полок</div><div class="v">' + totalShelves + '</div><div class="d">можно перераспределить</div></div><div class="predators-stat"><div class="b">Средний KPI</div><div class="v">' + avgEff.toFixed(2) + '</div><div class="d">при цели 1.00</div></div><div class="predators-stat"><div class="b">Совокупные потери</div><div class="v">' + totalLoss.toFixed(1) + '</div><div class="d">единиц недополученной эффективности</div></div>';
  card.appendChild(statsDiv);

  // Table
  var tableWrap = document.createElement("div");
  tableWrap.className = "predators-table-wrap";
  var table = document.createElement("table");
  table.className = "predators-table";
  table.innerHTML = '<thead><tr><th>№</th><th>Бренд</th><th>Отдел</th><th style="text-align:right">KPI</th><th style="text-align:right">Полок</th><th style="text-align:right">Потеря эффективности</th></tr></thead>';
  var tbody = document.createElement("tbody");
  PREDATORS.forEach(function(p, i) {
    var tr = document.createElement("tr");
    tr.innerHTML = '<td>' + (i + 1) + '</td><td><strong>' + p.brand + '</strong></td><td>' + p.dept + '</td><td style="text-align:right">' + p.eff.toFixed(2) + '</td><td style="text-align:right">' + p.shelves + '</td><td style="text-align:right" class="loss">−' + p.loss.toFixed(1) + '</td>';
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  wrap.appendChild(card);
  return wrap;
}
